<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة أسعار حلاوتنا 1447 هـ / 2026 م</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-dark: #7B5B00;
            --gold-mid: #C49A00;
            --gold-light: #F0D98A;
            --gold-accent: #A07800;
            --cream: #FDF8EC;
            --cream-dark: #F5EDD0;
            --text-dark: #2C1F00;
            --text-mid: #6B4E00;
            --border: #E8D48A;
            --white: #ffffff;
            --shadow: rgba(123,91,0,0.15);
            --page-pad: 24px;
            --bg-body: #F5EDD0;
        }

        body.dark-mode {
            --gold-dark: #FFD966;
            --gold-mid: #F1C232;
            --gold-light: #BF9000;
            --gold-accent: #F1C232;
            --cream: #1A1A1A;
            --cream-dark: #2D2D2D;
            --text-dark: #F5F5F5;
            --text-mid: #CCCCCC;
            --border: #444444;
            --white: #222222;
            --shadow: rgba(0,0,0,0.5);
            --bg-body: #121212;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-body);
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            color: var(--text-dark);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            padding-bottom: 60px;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--white);
            border: 1px solid var(--border);
            color: var(--gold-dark);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 2px 10px var(--shadow);
            z-index: 100;
            transition: all 0.3s;
        }

        .menu-book {
            max-width: 900px;
            margin: 20px auto;
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px var(--shadow), 6px 0 0 0 var(--gold-dark) inset;
            position: relative;
        }

        #progress-bar { height: 4px; background: var(--cream-dark); position: relative; }
        #progress-fill { height: 100%; background: linear-gradient(to left, var(--gold-mid), var(--gold-light)); transition: width 0.4s ease; width: 0%; }

        header {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(to bottom, var(--white) 0%, var(--cream) 100%);
            border-bottom: 2px dashed var(--border);
            position: relative;
        }

        header .logo-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 10px; }
        header .logo-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: logoSpin 18s linear infinite; direction: ltr; }
        header .logo-ring text { font-family: 'Tajawal', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 3px; fill: var(--gold-dark); direction: ltr; unicode-bidi: bidi-override; }
        header .logo-wrap img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75px; height: 75px; border-radius: 50%; object-fit: cover; display: block; background: var(--white); border: 2px solid var(--gold-light); filter: drop-shadow(0 4px 8px var(--shadow)); }

        @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        header h1 { font-family: 'Amiri', serif; font-size: 2rem; color: var(--gold-dark); font-weight: 700; }
        header .tagline { color: var(--gold-accent); font-size: 0.95rem; margin-top: 2px; }

        .stats-badge {
            display: inline-flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .header-badge {
            background: var(--cream-dark);
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.78rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .search-wrap { position: sticky; top: 0; z-index: 90; background: var(--cream); padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        .search-inner { position: relative; width: 100%; max-width: 560px; }
        .search-inner input { width: 100%; padding: 12px 46px 12px 44px; border: 1.5px solid var(--border); border-radius: 50px; font-family: 'Tajawal', sans-serif; font-size: 1rem; outline: none; background: var(--white); color: var(--text-dark); }
        .search-inner input:focus { border-color: var(--gold-dark); box-shadow: 0 0 0 3px rgba(123,91,0,0.12); }
        .search-inner .si-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--gold-mid); }
        #clearSearch { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold-mid); cursor: pointer; display: none; background: none; border: none; font-size: 1.1rem; }

        .autocomplete-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 15px 15px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 10px var(--shadow);
            display: none;
        }
        .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--cream-dark);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-dark);
        }
        .suggestion-item:hover { background: var(--cream); }
        .suggestion-cat { font-size: 0.75rem; color: var(--gold-accent); background: var(--cream-dark); padding: 2px 6px; border-radius: 4px; }

        #page-content { padding: var(--page-pad); min-height: 400px; max-height: 600px; overflow-y: auto; scroll-behavior: smooth; }

        /* ===== LOADING CHOCO ===== */
        .loading-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 60px 0;
            color: var(--text-mid);
            font-size: 1rem;
        }

        .choco-loader {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .choco-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--gold-dark);
            position: relative;
            animation: chocoWave 1.2s ease-in-out infinite;
        }

        .choco-dot::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.28);
            border-radius: 1px;
        }

        .choco-dot:nth-child(1) { animation-delay: 0s; }
        .choco-dot:nth-child(2) { animation-delay: 0.15s; }
        .choco-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes chocoWave {
            0%, 80%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
            40% { transform: translateY(-5px) scale(1.15); opacity: 1; }
        }

        /* ===== CATEGORY TITLE ===== */
        .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .cat-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--cream-dark); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--gold-dark); }
        .cat-title-text { font-family: 'Amiri', serif; font-size: 1.6rem; color: var(--gold-dark); font-weight: 700; }
        .cat-count { margin-right: auto; background: var(--cream-dark); border: 1px solid var(--border); color: var(--text-mid); font-size: 0.8rem; padding: 3px 10px; border-radius: 20px; }

        .index-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 16px; 
        }

        .index-btn { 
            position: relative;
            background: var(--white); 
            border: 1.5px solid var(--border); 
            height: 120px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-family: 'Tajawal', sans-serif; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: flex-end; 
            text-align: left; 
            width: 100%; 
            padding: 0;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s;
        }

        .index-cat-img { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .index-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.85) 40%, rgba(0, 0, 0, 0.1) 100%);
            z-index: 2;
            transition: background 0.4s;
        }

        .index-btn-info { 
            position: relative;
            z-index: 3; 
            display: flex; 
            flex-direction: column; 
            padding-left: 20px; 
            margin-right: auto; 
            transform: translateX(-15px); 
            opacity: 0.9;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
        }

        .index-btn-title { 
            font-weight: 800; 
            font-size: 1.25rem; 
            color: #ffffff; 
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        .idx-count { 
            font-size: 0.85rem; 
            color: var(--gold-light); 
            margin-top: 4px; 
            font-weight: bold;
        }

        .index-btn .fa-chevron-left {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) scale(0.6);
            color: #ffffff;
            z-index: 3;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .index-btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
            border-color: var(--gold-mid);
        }

        .index-btn:hover .index-cat-img {
            transform: scale(1.1) rotate(1deg);
        }

        .index-btn:hover .index-btn-info {
            transform: translateX(0);
            opacity: 1;
        }

        .index-btn:hover .fa-chevron-left {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .index-btn:hover::after {
            background: linear-gradient(to right, rgba(0, 0, 0, 0.9) 50%, rgba(0, 0, 0, 0.2) 100%);
        }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .menu-item { background: var(--white); border: 1.5px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .menu-item:hover { transform: translateY(-2px); border-color: var(--gold-mid); box-shadow: 0 4px 12px var(--shadow); }
        .item-details { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: 700; color: var(--text-dark); font-size: 1.05rem; }
        .item-package-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--cream-dark); color: var(--gold-dark); padding: 2px 8px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; width: fit-content; margin-top: 2px; }
        .search-cat-badge { font-size: 0.72rem; color: var(--white); background: var(--gold-accent); padding: 2px 6px; border-radius: 4px; width: fit-content; margin-bottom: 2px; }

        .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-right: 10px; }
        .price-block { display: flex; flex-direction: column; align-items: flex-end; background: var(--cream); padding: 4px 10px; border-radius: 8px; border: 1px dashed var(--gold-mid); }
        .item-price { font-weight: 800; color: var(--gold-accent); font-size: 1.15rem; }
        .item-price .currency { font-size: 0.75rem; }
        .unit-label { font-size: 0.72rem; color: var(--text-mid); }

        .item-actions { display: flex; gap: 6px; }
        .act-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--cream); color: var(--text-mid); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .act-btn:hover { background: var(--gold-dark); color: #fff; }
        .act-btn.wa:hover { background: #25D366; color: #fff; border-color: #25D366; }

        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--gold-dark); color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
        #toast.show { opacity: 1; }

        .toggle-btn { width: 100%; margin-top: 12px; padding: 12px; border: 1.5px dashed var(--border); background: var(--cream); color: var(--gold-dark); border-radius: 8px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 600; font-size: 1rem; }

        .pagination-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--gold-mid); }
        .nav-btn { background: var(--gold-dark); color: #fff; padding: 10px 18px; border: none; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-center { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        #pageInfo { color: #fff; font-size: 0.9rem; font-weight: 600; }
        .index-nav-btn { background: #fff; color: var(--gold-dark); padding: 5px 12px; border: none; border-radius: 50px; cursor: pointer; font-size: 0.82rem; font-weight: 700; display: none; }

        .social-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--gold-dark);
            padding: 10px 0;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .social-bar a { color: var(--gold-light); font-size: 1.4rem; transition: transform 0.2s; }
        .social-bar a:hover { color: #fff; transform: scale(1.1); }

        #scrollTopBtn { position: absolute; bottom: 70px; left: 20px; width: 36px; height: 36px; border-radius: 50%; background: var(--gold-dark); color: #fff; border: none; display: none; align-items: center; justify-content: center; z-index: 5; }

        .no-results { text-align: center; padding: 40px 20px; color: var(--text-mid); }
        .no-results i { font-size: 2.5rem; margin-bottom: 12px; display: block; }

        @media (max-width: 600px) {
            .menu-book { margin: 0; border-radius: 0; }
            #page-content { padding: 10px; max-height: 55vh; }
            .items-grid, .index-grid { grid-template-columns: 1fr; gap: 8px; }
            header h1 { font-size: 1.6rem; }
            .index-btn { height: 110px; }
            .index-btn-info { padding-left: 15px; }
            .menu-item { padding: 10px; }
            .act-btn { width: 36px; height: 36px; font-size: 1rem; }
            .pagination-nav { padding: 8px 12px; }
            .nav-btn { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>

<script>
const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGoyAsNR0JPLb2TQNSDI55YiWFCV0b5bRAmUTsWJxLvjCL_wA-NuoK2_OCCPggtjQ7eI_1JsXxvxlX/pub?output=csv';

const pageContent = document.getElementById('page-content');
const searchInput  = document.getElementById('searchInput');
const clearSearch  = document.getElementById('clearSearch');
const autocompleteBox = document.getElementById('autocompleteBox');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const indexBtn     = document.getElementById('indexBtn');
const pageInfoEl   = document.getElementById('pageInfo');
const progressFill = document.getElementById('progress-fill');
const scrollTopBtn = document.getElementById('scrollTopBtn');
const toastEl      = document.getElementById('toast');
const darkModeToggle = document.getElementById('darkModeToggle');

let allData = [];
let allCategories = [];
let currentPageIndex = 0;
const PREVIEW_COUNT = 6;

const catImages = {
     'علف': 'alaf.jpeg',
    'مدور': 'mdawar.jpeg',
    'ملبن': 'malban.jpeg',
    'قشطة': 'qeshta.jpeg',
    'بولا': 'baula.jpeg',
    'مربي': 'mraba.jpeg',
    'الأكثر مبيعاً': 'logo.png',
    'فوااخر': 'fwagher.jpeg',
    'معبأ': 'moaba.jpeg',
    'نوجا': 'noga.jpeg',
    'شكلمة': 'shklama.jpg'
};

function getCatImg(name) {
    for (const [k, v] of Object.entries(catImages)) {
        if (name.includes(k)) return v;
    }
    return catImages.default;
}

darkModeToggle.onclick = () => {
    document.body.classList.toggle('dark-mode');
    darkModeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
};

function findKey(item, target) {
    for (const key in item) {
        if (key && key.trim() === target) return key;
    }
    return null;
}

function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function animatePage(cb) {
    pageContent.classList.add('fading');
    setTimeout(() => { cb(); pageContent.scrollTop = 0; }, 200);
}

function cleanText(str) {
    if (!str) return '';
    return str.toLowerCase()
        .replace(/[أإآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .trim();
}

function processData(data) {
    const map = {};
    const bestSellers = [];
    let validItemsCount = 0;

    data.forEach(item => {
        const catKey  = findKey(item, 'التصنيف');
        const nameKey = findKey(item, 'الصنف');
        const priceKey= findKey(item, 'السعر');
        const unitKey = findKey(item, 'الوحدة');
        const pkgKey  = findKey(item, 'العبوة');
        const bestKey = findKey(item, 'الأكثر مبيعاً');

        const cat   = catKey   ? item[catKey].trim()   : null;
        const name  = nameKey  ? item[nameKey].trim()  : null;
        const price = priceKey ? item[priceKey].trim() : null;
        const unit  = unitKey  ? item[unitKey].trim()  : null;
        const pkg   = pkgKey   ? item[pkgKey].trim()   : null;
        const isBest= bestKey  ? item[bestKey].trim().toLowerCase() : '';

        if (cat && name) {
            validItemsCount++;
            const itemObj = { name, price, unit, pkg, categoryName: cat };
            
            if (!map[cat]) map[cat] = [];
            map[cat].push(itemObj);

            if (isBest === 'نعم' || isBest === 'true' || isBest === 'موافق') {
                bestSellers.push(itemObj);
            }
        }
    });

    document.getElementById('totalItemsBadge').textContent = `إجمالي المنتجات: ${validItemsCount}`;
    const now = new Date();
    document.getElementById('updateDateBadge').textContent = `تحديث: ${now.toLocaleDateString('ar-EG')}`;

    const cats = Object.keys(map)
        .filter(k => map[k].length > 0)
        .map(k => ({ categoryName: k, items: map[k], isIndex: false }));

    allCategories = [{ categoryName: 'فهرس المنتجات', isIndex: true, items: [] }];
    
    if (bestSellers.length > 0) {
        allCategories.push({ categoryName: '⭐ الأكثر مبيعاً', items: bestSellers, isIndex: false });
    }
    
    allCategories.push(...cats);
}

function renderIndex() {
    const grid = document.createElement('div');
    grid.className = 'index-grid';

    allCategories.forEach((cat, idx) => {
        if (idx === 0) return;
        const btn = document.createElement('button');
        btn.className = 'index-btn';
        
        btn.innerHTML = `
            <img class="index-cat-img" src="${getCatImg(cat.categoryName)}" alt="${cat.categoryName}">
            <div class="index-btn-info">
                <span class="index-btn-title">${cat.categoryName}</span>
                <span class="idx-count">${cat.items.length} صنف</span>
            </div>
            <i class="fas fa-chevron-left"></i>
        `;
        btn.onclick = () => displayPage(idx);
        grid.appendChild(btn);
    });

    pageContent.innerHTML = '';
    const hdr = buildCatHeader('فهرس أقسام Jana Gold', (allCategories.length - 1) + ' قسم رئيسي', 'fa-th-large');
    pageContent.appendChild(hdr);
    pageContent.appendChild(grid);
}

function buildCatHeader(title, countText, iconClass) {
    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.innerHTML = `
        <div class="cat-icon"><i class="fas ${iconClass}"></i></div>
        <div class="cat-title-text">${title}</div>
        <div class="cat-count">${countText}</div>
    `;
    return hdr;
}

function buildItemCard(item, showBadge = false) {
    const el = document.createElement('div');
    el.className = 'menu-item';

    const priceDisplay = item.price || '--';
    const pkgBadge = item.pkg ? `<div class="item-package-tag"><i class="fas fa-box" style="font-size:0.7rem;margin-left:3px"></i> ${item.pkg}</div>` : '';
    const unitLabel = item.unit ? `<div class="unit-label">لكل ${item.unit}</div>` : '';
    const catBadge = showBadge ? `<div class="search-cat-badge">${item.categoryName}</div>` : '';
    
    const shareText = `*${item.name}*\nالسعر: ${priceDisplay} ج.م${item.pkg ? '\nالعبوة: ' + item.pkg : ''}\n📍 Jana Gold`;

    el.innerHTML = `
        <div class="item-details">
            ${catBadge}
            <div class="item-name">${item.name}</div>
            ${pkgBadge}
        </div>
        <div class="item-right">
            <div class="price-block">
                <div class="item-price">${priceDisplay} <span class="currency">ج.م</span></div>
                ${unitLabel}
            </div>
            <div class="item-actions">
                <button class="act-btn copy-btn" title="نسخ السعر"><i class="fas fa-copy"></i></button>
                <a class="act-btn wa" href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    `;

    el.querySelector('.copy-btn').onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(`${item.name}: ${priceDisplay} ج.م`);
        showToast('تم نسخ السعر ✓');
    };

    return el;
}

function renderCategory(catData, fullView = false) {
    pageContent.innerHTML = '';
    if (catData.isIndex) { renderIndex(); return; }

    const icon = catData.categoryName.includes('الأكثر') ? 'fa-fire' : 'fa-box-open';
    const hdr  = buildCatHeader(catData.categoryName, catData.items.length + ' صنف', icon);
    pageContent.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'items-grid';

    const shown = (fullView || catData.items.length <= PREVIEW_COUNT) ? catData.items : catData.items.slice(0, PREVIEW_COUNT);
    shown.forEach(item => grid.appendChild(buildItemCard(item)));
    pageContent.appendChild(grid);

    if (catData.items.length > PREVIEW_COUNT) {
        const btn = document.createElement('button');
        btn.className = 'toggle-btn';
        btn.innerHTML = fullView ? '<i class="fas fa-chevron-up"></i> عرض أقل' : `<i class="fas fa-chevron-down"></i> عرض المزيد (${catData.items.length - PREVIEW_COUNT} إضافي)`;
        btn.onclick = () => renderCategory(catData, !fullView);
        pageContent.appendChild(btn);
    }
}

function displayPage(idx) {
    if (idx < 0 || idx >= allCategories.length) return;
    currentPageIndex = idx;
    renderCategory(allCategories[idx]);
    updateNav();
}

function updateNav() {
    const total = allCategories.length;
    const isFirst = currentPageIndex === 0;
    const isLast  = currentPageIndex === total - 1;

    prevBtn.disabled = isFirst;
    nextBtn.disabled = isLast;
    progressFill.style.width = total <= 1 ? '0%' : (currentPageIndex / (total - 1)) * 100 + '%';

    if (isFirst) {
        pageInfoEl.innerHTML = 'الرئيسية';
        indexBtn.style.display = 'none';
    } else {
        pageInfoEl.innerHTML = `${currentPageIndex} / ${total - 1}`;
        indexBtn.style.display = 'inline-flex';
    }
}

prevBtn.onclick  = () => displayPage(currentPageIndex - 1);
nextBtn.onclick  = () => displayPage(currentPageIndex + 1);
indexBtn.onclick = () => displayPage(0);

searchInput.addEventListener('input', (e) => {
    const term = e.target.value.trim();
    clearSearch.style.display = term ? 'block' : 'none';
    
    if (!term) {
        autocompleteBox.style.display = 'none';
        displayPage(currentPageIndex);
        return;
    }

    const cleanedTerm = cleanText(term);
    const filtered = [];

    allData.forEach(item => {
        const nk = findKey(item, 'الصنف');
        const ck = findKey(item, 'التصنيف');
        const nameText = item[nk] ? item[nk] : '';
        const catText = item[ck] ? item[ck] : '';

        if (cleanText(nameText).includes(cleanedTerm) || cleanText(catText).includes(cleanedTerm)) {
            const pk = findKey(item, 'السعر');
            const uk = findKey(item, 'الوحدة');
            const gk = findKey(item, 'العبوة');
            filtered.push({
                name: nameText.trim(),
                price: pk ? item[pk].trim() : '',
                unit: uk ? item[uk].trim() : '',
                pkg: gk ? item[gk].trim() : '',
                categoryName: catText.trim()
            });
        }
    });

    showAutocomplete(filtered, term);
    handleSearchRender(filtered, term);
});

function showAutocomplete(matches, originalTerm) {
    if (matches.length === 0) {
        autocompleteBox.style.display = 'none';
        return;
    }
    autocompleteBox.innerHTML = '';
    matches.slice(0, 4).forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span>${item.name}</span> <span class="suggestion-cat">${item.categoryName}</span>`;
        div.onclick = () => {
            searchInput.value = item.name;
            autocompleteBox.style.display = 'none';
            handleSearchRender([item], item.name);
        };
        autocompleteBox.appendChild(div);
    });
    autocompleteBox.style.display = 'block';
}

function handleSearchRender(results, term) {
    pageContent.innerHTML = '';
    if (!results.length) {
        pageContent.innerHTML = `<div class="no-results"><i class="fas fa-search-minus"></i><p>لا توجد نتائج لـ "<strong>${term}</strong>"</p></div>`;
        return;
    }

    const hdr = buildCatHeader(`نتائج البحث عن: "${term}"`, results.length + ' نتيجة', 'fa-search');
    pageContent.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'items-grid';
    results.forEach(item => grid.appendChild(buildItemCard(item, true)));
    pageContent.appendChild(grid);
}

clearSearch.onclick = () => {
    searchInput.value = '';
    clearSearch.style.display = 'none';
    autocompleteBox.style.display = 'none';
    displayPage(currentPageIndex);
};

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
        autocompleteBox.style.display = 'none';
    }
});

Papa.parse(sheetURL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete(results) {
        allData = results.data;
        processData(allData);
        if (allCategories.length > 1) displayPage(0);
    },
    error() {
        pageContent.innerHTML = '<div style="padding:40px;text-align:center;color:#c0392b"><i class="fas fa-exclamation-triangle"></i> خطأ في الاتصال بقاعدة البيانات</div>';
    }
});
</script>
</body>
</html>
