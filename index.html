<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jana Gold — قائمة الأسعار 1448 هـ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:        #1A1208;
    --ink-mid:    #2C2416;
    --gold:       #8B6914;
    --gold-lt:    #C9B87A;
    --gold-bg:    #F2EBD9;
    --cream:      #FAF7F2;
    --rule:       #E0D5C0;
    --muted:      #8B7040;
    --white:      #FFFFFF;
    --dark-bg:    #1A1208;
    --dark-text:  #FAF7F2;
    --success:    #27ae60;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--cream);
    color: var(--ink-mid);
    min-height: 100vh;
    padding-bottom: 100px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ── HEADER ── */
  .jana-header {
    padding: 2rem 2rem 1.25rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2rem;
  }

  .header-text-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .masthead-issue {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
  }

  .masthead-title {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -1px;
  }

  .masthead-title em {
    font-style: italic;
    color: var(--gold);
  }

  .tagline-ar {
    font-size: 1.1rem;
    font-weight: 500;
    color: #5C4A1E;
    font-style: italic;
    margin-top: 2px;
  }

  .stats-line {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .logo-box {
    width: 110px;
    height: 110px;
  }

  .brand-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ── PROGRESS BAR ── */
  #progress-bar { height: 3px; background: var(--rule); }
  #progress-fill { height: 100%; background: var(--gold); transition: width .4s ease; width: 0%; }

  /* ── SEARCH ── */
  .search-bar {
    padding: .85rem 2rem;
    background: var(--cream);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .search-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 500px;
    border: 1px solid var(--gold-lt);
    border-radius: 2px;
    padding: 8px 14px;
    background: var(--white);
    position: relative;
  }

  .search-inner input {
    border: none;
    outline: none;
    font-family: 'Tajawal', sans-serif;
    font-size: .95rem;
    background: transparent;
    color: var(--ink-mid);
    flex: 1;
  }

  .search-inner input::placeholder { color: #B0A080; }
  .si-icon { color: var(--gold); font-size: 14px; }

  #clearSearch {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 14px;
    display: none;
    padding: 0;
  }

  .autocomplete-box {
    position: absolute;
    top: 100%;
    right: 0; left: 0;
    background: var(--white);
    border: 1px solid var(--rule);
    border-top: none;
    z-index: 30;
    display: none;
    max-height: 220px;
    overflow-y: auto;
  }

  .auto-item {
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border-bottom: 1px solid var(--rule);
    font-size: .9rem;
  }

  .auto-item:hover { background: var(--gold-bg); }
  .auto-cat { font-size: .72rem; color: var(--gold); background: var(--gold-bg); padding: 2px 7px; }

  /* ── NAV TABS ── */
  .nav-strip {
    display: flex;
    border-bottom: 2px solid var(--ink);
    padding: 0 2rem;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-strip::-webkit-scrollbar { display: none; }

  .nav-tab {
    padding: .6rem 1.1rem;
    font-family: 'Tajawal', sans-serif;
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: transparent;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
    transition: color .2s, border-color .2s;
  }

  .nav-tab.active { color: var(--ink); border-bottom-color: var(--gold); }
  .nav-tab:hover  { color: var(--ink); }

  /* ── PAGE BODY ── */
  #page-content {
    padding: 1.75rem 2rem;
    min-height: 400px;
  }

  /* ── LOADING ── */
  .loading-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 80px 0;
    color: var(--muted);
    font-size: .95rem;
  }

  .choco-loader { display: flex; gap: 5px; }

  .choco-dot {
    width: 9px; height: 9px;
    border-radius: 2px;
    background: var(--gold);
    animation: chocoWave 1.2s ease-in-out infinite;
  }

  .choco-dot:nth-child(2) { animation-delay: .15s; }
  .choco-dot:nth-child(3) { animation-delay: .3s;  }

  @keyframes chocoWave {
    0%,80%,100% { transform: translateY(0) scale(1);   opacity: .5; }
    40%          { transform: translateY(-5px) scale(1.2); opacity: 1; }
  }

  /* ── EYEBROW ── */
  .section-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }

  .eyebrow-line { flex: 1; height: 1px; background: var(--rule); }

  .eyebrow-text {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
    font-weight: 500;
  }

  /* ── INDEX GRID ── */
  .editorial-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--rule);
    margin-bottom: 0;
  }

  .cat-block {
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: transform .3s, box-shadow .3s;
    overflow: hidden;
    height: 130px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
  }

  .cat-block:nth-child(3n) { border-right: none; }
  .cat-block:nth-last-child(-n+3) { border-bottom: none; }

  .cat-block:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 2; }
  .cat-block:hover .cat-bg-img { transform: scale(1.08); }

  .cat-bg-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .4s ease;
  }

  .cat-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,8,4,0.88) 40%, rgba(10,8,4,0.15) 100%);
  }

  .cat-info {
    position: relative;
    z-index: 2;
    padding: .85rem 1rem 2rem;
  }

  .cat-number {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: rgba(201,184,122,0.35);
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .cat-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #FAF7F2;
    margin-bottom: 3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .cat-count-label { font-size: .68rem; color: var(--gold-lt); letter-spacing: 1px; }

  .cat-arrow {
    position: absolute;
    bottom: .75rem;
    left: .85rem;
    color: var(--gold-lt);
    font-size: 13px;
    z-index: 2;
  }

  /* ── BEST SELLERS DARK PANEL ── */
  .best-panel {
    background: var(--dark-bg);
    color: var(--dark-text);
    padding: 1.5rem;
    border: 1px solid #3A3020;
    margin-bottom: 0;
  }

  .best-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-lt);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .best-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }

  .best-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #3A3020;
  }

  .best-item-row:last-child { border-bottom: none; }
  .best-item-name { font-size: .9rem; color: #E8DFC0; }

  .best-item-price {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold-lt);
  }

  .best-item-price span { font-size: .68rem; font-family: 'Tajawal', sans-serif; }

  .best-pkg {
    font-size: .7rem;
    color: #9A8A60;
    margin-right: 8px;
  }

  /* ── ITEMS LIST ── */
  .cat-header-bar {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 1.25rem;
    padding-bottom: .75rem;
    border-bottom: 2px solid var(--ink);
  }

  .cat-header-bar .ch-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--ink);
  }

  .cat-header-bar .ch-count {
    font-size: .75rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .items-table { width: 100%; border-collapse: collapse; }
  .items-table thead tr { border-bottom: 1px solid var(--ink); }

  .items-table thead th {
    font-size: .7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    padding: 6px 8px;
    text-align: right;
  }

  .items-table thead th:last-child { text-align: left; }

  .items-table tbody tr {
    border-bottom: 1px solid var(--rule);
    transition: background .15s;
  }

  .items-table tbody tr:hover { background: var(--gold-bg); }

  .items-table td { padding: 12px 8px; vertical-align: middle; }

  .td-name { font-size: 1rem; font-weight: 500; color: var(--ink); }

  .td-pkg {
    font-size: .72rem;
    color: var(--gold);
    background: var(--gold-bg);
    padding: 2px 8px;
    display: inline-block;
    margin-top: 3px;
  }

  .td-unit { font-size: .78rem; color: var(--muted); }

  .td-price {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--gold);
    text-align: left;
    white-space: nowrap;
  }

  .td-price span { font-size: .65rem; font-family: 'Tajawal', sans-serif; color: var(--muted); }

  .td-actions { text-align: left; white-space: nowrap; }

  /* ── CART QUANTITY CONTROLLER ── */
  .qty-container {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--gold-lt);
    border-radius: 2px;
    background: var(--white);
    overflow: hidden;
  }
  .qty-btn {
    background: transparent;
    border: none;
    color: var(--gold);
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  .qty-btn:hover { background: var(--gold-bg); }
  .qty-input {
    width: 45px;
    height: 28px;
    border: none;
    border-left: 1px solid var(--gold-lt);
    border-right: 1px solid var(--gold-lt);
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--ink-mid);
    background: transparent;
    outline: none;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .toggle-more-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 10px;
    border: 1px dashed var(--rule);
    background: transparent;
    color: var(--gold);
    font-family: 'Tajawal', sans-serif;
    font-size: .85rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background .2s;
  }

  .toggle-more-btn:hover { background: var(--gold-bg); }

  /* ── SEARCH RESULTS ── */
  .search-badge {
    font-size: .7rem;
    background: var(--gold);
    color: var(--white);
    padding: 2px 7px;
    margin-bottom: 3px;
    display: inline-block;
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .no-results i { font-size: 2rem; margin-bottom: 12px; display: block; color: var(--rule); }

  /* ── PAGINATION ── */
  .pagination-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 2rem;
    background: var(--ink);
    border-top: 1px solid #3A3020;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid var(--gold-lt);
    color: var(--gold-lt);
    padding: 8px 16px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: .85rem;
    font-weight: 500;
    letter-spacing: 1px;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-btn:hover:not(:disabled) { background: var(--gold); color: var(--white); border-color: var(--gold); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }

  .nav-center { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #pageInfo { color: var(--gold-lt); font-size: .8rem; letter-spacing: 2px; }

  #indexBtn {
    background: transparent;
    border: none;
    color: var(--gold-lt);
    font-size: .75rem;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    letter-spacing: 1px;
    display: none;
  }

  #indexBtn:hover { color: var(--white); }

  /* ── FLOATING CART BADGE ── */
  .floating-cart {
    position: fixed;
    bottom: 65px;
    right: 20px;
    background: var(--gold);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 150;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 0.95rem;
    transition: transform 0.2s, background 0.2s;
    border: 1px solid var(--gold-lt);
  }
  .floating-cart:hover { transform: scale(1.05); background: var(--ink); }
  .cart-count-badge {
    background: var(--white);
    color: var(--gold);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }

  /* ── CART MODAL ── */
  .cart-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .cart-modal.show { display: flex; }
  .cart-modal-content {
    background: var(--cream);
    color: var(--ink-mid);
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    border-radius: 4px;
    border: 1px solid var(--gold);
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .cart-modal-header {
    padding: 15px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--ink);
    color: var(--gold-lt);
  }
  .cart-modal-header h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
  .close-cart { background: none; border: none; color: var(--gold-lt); cursor: pointer; font-size: 1.2rem; }
  .cart-modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }
  .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  .cart-table th, .cart-table td { padding: 10px 5px; text-align: right; border-bottom: 1px solid var(--rule); font-size: 0.9rem; }
  .cart-table th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
  .cart-summary-box {
    background: var(--gold-bg);
    padding: 15px;
    border-radius: 2px;
    margin-top: 15px;
    border: 1px solid var(--rule);
  }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 500; }
  .summary-row.total { font-size: 1.2rem; color: var(--gold); font-weight: 700; border-top: 1px dashed var(--gold); padding-top: 8px; margin-bottom: 0; }
  .cart-modal-footer {
    padding: 15px 20px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .phone-select-box {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .phone-select-box label { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
  .phone-input-group {
    display: flex;
    gap: 10px;
  }
  .phone-input-group select, .phone-input-group input {
    font-family: 'Tajawal', sans-serif;
    padding: 8px;
    border: 1px solid var(--gold-lt);
    background: var(--white);
    color: var(--ink-mid);
    outline: none;
    border-radius: 2px;
  }
  .phone-input-group select { width: 140px; }
  .phone-input-group input { flex: 1; }
  
  .submit-order-btn {
    background: var(--success);
    color: white;
    border: none;
    padding: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.2s;
  }
  .submit-order-btn:hover { opacity: 0.9; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--gold-lt);
    padding: 8px 20px;
    font-size: .85rem;
    opacity: 0;
    transition: opacity .3s;
    z-index: 999;
    border: 1px solid var(--gold);
    letter-spacing: 1px;
  }

  #toast.show { opacity: 1; }

  /* ── SOCIAL BAR ── */
  .social-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--ink);
    border-top: 1px solid #3A3020;
    padding: 10px 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
  }

  .social-bar a {
    color: var(--gold-lt);
    font-size: 1.2rem;
    transition: color .2s;
  }

  .social-bar a:hover { color: var(--white); }

  /* ── DARK MODE TOGGLE ── */
  #darkModeToggle {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 50;
    background: var(--white);
    border: 1px solid var(--rule);
    color: var(--gold);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── DARK MODE ── */
  body.dark-mode {
    --ink:      #FAF7F2;
    --ink-mid:  #E8DFC0;
    --gold:     #C9B87A;
    --gold-lt:  #8B6914;
    --gold-bg:  #2A2010;
    --cream:    #121008;
    --rule:     #3A3020;
    --muted:    #9A8A60;
    --white:    #1E180A;
    --dark-bg:  #0A0804;
    --dark-text:#FAF7F2;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .jana-header { padding: 1.5rem 1rem; gap: 1rem; }
    .masthead-title { font-size: 2.2rem; }
    .logo-box { width: 170px; height: 90px; padding: 1px; }
    .tagline-ar { font-size: 0.95rem; }
    .stats-line { font-size: 11px; }
    .editorial-grid { grid-template-columns: 1fr 1fr; }
    #page-content { padding: 1rem; }
    .items-table td { padding: 9px 5px; }
    .pagination-nav { padding: 10px 1rem; }
    .phone-input-group { flex-direction: column; }
    .phone-input-group select { width: 100%; }
    .floating-cart { bottom: 65px; left: 20px; right: auto; }
  }
</style>
</head>
<body>

<script>
// ══════════════════════════════════════════
//  CONFIG — غيّر روابط الشيت والماكرو هنا
// ══════════════════════════════════════════
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGoyAsNR0JPLb2TQNSDI55YiWFCV0b5bRAmUTsWJxLvjCL_wA-NuoK2_OCCPggtjQ7eI_1JsXxvxlX/pub?output=csv';

// ضع هنا رابط Web App الخاص بـ Google Apps Script الذي ستنشئه لتخزين الطلبات بالشيت
const APPS_SCRIPT_WEBAPP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL';

const PREVIEW = 8;

// ── refs ──
const pageContent = document.getElementById('page-content');
const searchInput  = document.getElementById('searchInput');
const clearSearch  = document.getElementById('clearSearch');
const autoBox      = document.getElementById('autocompleteBox');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const indexBtn     = document.getElementById('indexBtn');
const pageInfoEl   = document.getElementById('pageInfo');
const progressFill = document.getElementById('progress-fill');
const toastEl      = document.getElementById('toast');
const navStrip     = document.getElementById('navStrip');
const statsLine    = document.getElementById('statsLine');
const darkBtn      = document.getElementById('darkModeToggle');

let allData      = [];
let allCats      = [];
let currentIdx   = 0;

// ── Cart State ──
let cart = {}; // هيكل البيانات: { "اسم الصنف": { item, quantity } }

// ── dark mode ──
darkBtn.onclick = () => {
  document.body.classList.toggle('dark-mode');
  darkBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
};

// ── helpers ──
function fk(item, label) {
  for (const k in item) if (k && k.trim() === label) return k;
  return null;
}

function cleanText(s) {
  return (s||'').toLowerCase()
    .replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

// ── category images ──
const catImages = {
  'علف':    'alaf.jpeg',
  'مدور':   'mdawar.jpeg',
  'ملبن':   'malban.jpeg',
  'قشطة':   'qeshta.jpeg',
  'بولا':   'baula.jpeg',
  'مربي':   'mraba.jpeg',
  'فوااخر': 'fwagher.jpeg',
  'معبأ':   'moaba.jpeg',
  'نوجا':   'noga.jpeg',
  'شكلمة':  'shklama.jpg',
  'default': 'logo.png'
};

function getCatImg(name) {
  for (const [k, v] of Object.entries(catImages)) {
    if (name.includes(k)) return v;
  }
  return catImages['default'];
}

// ── process CSV ──
function processData(data) {
  const map = {};
  const best = [];
  let total = 0;

  data.forEach(row => {
    const cat   = (row[fk(row,'التصنيف')]||'').trim();
    const name  = (row[fk(row,'الصنف')]||'').trim();
    const price = (row[fk(row,'السعر')]||'').trim();
    const unit  = (row[fk(row,'الوحدة')]||'').trim();
    const pkg   = (row[fk(row,'العبوة')]||'').trim();
    const code  = (row[fk(row,'كود الصنف')]||'').trim(); // سحب كود الصنف للحفاظ عليه وتصديره
    const isBest= (row[fk(row,'الأكثر مبيعاً')]||'').trim().toLowerCase();

    if (!cat || !name) return;
    total++;
    const obj = { name, price, unit, pkg, code, categoryName: cat };
    if (!map[cat]) map[cat] = [];
    map[cat].push(obj);
    if (['نعم','true','موافق'].includes(isBest)) best.push(obj);
  });

  statsLine.textContent = `${total} صنف · ${Object.keys(map).length} قسم`;

  const cats = Object.keys(map).filter(k => map[k].length).map(k => ({ categoryName: k, items: map[k] }));

  allCats = [{ categoryName: 'فهرس المنتجات', isIndex: true, items: [] }];
  if (best.length) allCats.push({ categoryName: '⭐ الأكثر مبيعاً', items: best, isBest: true });
  allCats.push(...cats);

  buildNavTabs();
  displayPage(0);
}

// ── build nav tabs ──
function buildNavTabs() {
  navStrip.innerHTML = '';
  allCats.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-tab' + (i === 0 ? ' active' : '');
    btn.textContent = cat.isIndex ? 'الكل' : cat.categoryName;
    btn.dataset.idx = i;
    btn.onclick = () => displayPage(i);
    navStrip.appendChild(btn);
  });
}

// ── render index ──
function renderIndex() {
  pageContent.innerHTML = '';

  const eyebrow = mkEyebrow('فهرس الأقسام');
  pageContent.appendChild(eyebrow);

  const best = allCats.find(c => c.isBest);
  if (best) {
    const panel = document.createElement('div');
    panel.className = 'best-panel';
    panel.innerHTML = `
      <div class="best-label">⭐ الأكثر مبيعاً</div>
      <div class="best-title">أبرز الأصناف هذا الموسم</div>
      ${best.items.slice(0,5).map(it => `
        <div class="best-item-row">
          <span class="best-item-name">
            ${it.pkg ? `<span class="best-pkg">[${it.pkg}]</span>` : ''}
            ${it.name}
          </span>
          <span class="best-item-price">${it.price||'—'} <span>ج.م</span></span>
        </div>
      `).join('')}
    `;
    panel.style.cursor = 'pointer';
    panel.onclick = () => displayPage(allCats.indexOf(best));
    pageContent.appendChild(panel);
  }

  const eyebrow2 = mkEyebrow('الأقسام الرئيسية');
  eyebrow2.style.marginTop = '1.5rem';
  pageContent.appendChild(eyebrow2);

  const grid = document.createElement('div');
  grid.className = 'editorial-grid';

  let n = 1;
  allCats.forEach((cat, idx) => {
    if (cat.isIndex || cat.isBest) return;
    const block = document.createElement('div');
    block.className = 'cat-block';
    block.innerHTML = `
      <img class="cat-bg-img" src="${getCatImg(cat.categoryName)}" alt="${cat.categoryName}" onerror="this.style.display='none'">
      <div class="cat-overlay"></div>
      <div class="cat-info">
        <div class="cat-number">${String(n++).padStart(2,'0')}</div>
        <div class="cat-name">${cat.categoryName}</div>
        <div class="cat-count-label">${cat.items.length} صنف</div>
      </div>
      <i class="fas fa-arrow-left cat-arrow"></i>
    `;
    block.onclick = () => displayPage(idx);
    grid.appendChild(block);
  });

  pageContent.appendChild(grid);
}

// ── render category ──
function renderCategory(cat, fullView = false) {
  pageContent.innerHTML = '';

  const bar = document.createElement('div');
  bar.className = 'cat-header-bar';
  bar.innerHTML = `
    <div class="ch-title">${cat.categoryName}</div>
    <div class="ch-count">${cat.items.length} صنف</div>
  `;
  pageContent.appendChild(bar);

  const shown = (fullView || cat.items.length <= PREVIEW) ? cat.items : cat.items.slice(0, PREVIEW);

  const table = document.createElement('table');
  table.className = 'items-table';
  table.innerHTML = `
    <thead>
      <tr>
        <th>الصنف</th>
        <th>الوحدة</th>
        <th>السعر</th>
        <th style="text-align: left; padding-left: 20px;">الكمية المطلوب لشراء</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;

  const tbody = table.querySelector('tbody');
  shown.forEach(item => tbody.appendChild(buildRow(item)));
  pageContent.appendChild(table);

  if (cat.items.length > PREVIEW) {
    const btn = document.createElement('button');
    btn.className = 'toggle-more-btn';
    btn.innerHTML = fullView
      ? '<i class="fas fa-chevron-up"></i>  عرض أقل'
      : `<i class="fas fa-chevron-down"></i>  عرض المزيد (${cat.items.length - PREVIEW} إضافي)`;
    btn.onclick = () => {
      renderCategory(cat, !fullView);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    pageContent.appendChild(btn);
  }
}

// ── extract numerical weight from package string ──
function parseWeightFromPkg(pkgStr) {
  if (!pkgStr) return 1;
  // استخراج الأرقام العشرية أو الصحيحة من خانة العبوة (مثال: "علبة 0.5 كيلو" أو "0.25")
  const match = pkgStr.match(/([0-9.]+)/);
  if (match) {
    const weight = parseFloat(match[1]);
    return isNaN(weight) || weight <= 0 ? 1 : weight;
  }
  return 1;
}

// ── build table row with complete quantity inputs ──
function buildRow(item, showBadge = false) {
  const tr = document.createElement('tr');
  const currentQty = cart[item.name] ? cart[item.name].quantity : 0;

  tr.innerHTML = `
    <td>
      ${showBadge ? `<div class="search-badge">${item.categoryName}</div>` : ''}
      <div class="td-name">${item.name}</div>
      ${item.pkg ? `<div class="td-pkg">${item.pkg}</div>` : ''}
    </td>
    <td class="td-unit">${item.unit||'—'}</td>
    <td class="td-price">${item.price||'—'} <span>ج.م</span></td>
    <td class="td-actions">
      <div class="qty-container">
        <button class="qty-btn minus-btn"><i class="fas fa-minus"></i></button>
        <input type="number" class="qty-input" value="${currentQty}" min="0">
        <button class="qty-btn plus-btn"><i class="fas fa-plus"></i></button>
      </div>
    </td>
  `;

  const input = tr.querySelector('.qty-input');
  
  tr.querySelector('.plus-btn').onclick = (e) => {
    e.stopPropagation();
    input.value = parseInt(input.value) + 1;
    updateCartItem(item, parseInt(input.value));
  };

  tr.querySelector('.minus-btn').onclick = (e) => {
    e.stopPropagation();
    if (parseInt(input.value) > 0) {
      input.value = parseInt(input.value) - 1;
      updateCartItem(item, parseInt(input.value));
    }
  };

  input.oninput = (e) => {
    let val = parseInt(input.value);
    if (isNaN(val) || val < 0) val = 0;
    updateCartItem(item, val);
  };

  return tr;
}

// ── update shopping cart state ──
function updateCartItem(item, qty) {
  if (qty > 0) {
    cart[item.name] = { item: item, quantity: qty };
  } else {
    delete cart[item.name];
  }
  updateFloatingCartBadge();
}

function updateFloatingCartBadge() {
  let distinctItems = Object.keys(cart).length;
  document.getElementById('cartCountBadge').textContent = distinctItems;
}

// ── Cart Modal Interactions ──
function openCartModal() {
  const modal = document.getElementById('cartModal');
  const emptyMsg = document.getElementById('cartEmptyMsg');
  const contentArea = document.getElementById('cartContentArea');
  const tbody = document.getElementById('cartTableBody');
  const grandTotalEl = document.getElementById('cartGrandTotal');

  tbody.innerHTML = '';
  let grandTotal = 0;
  let cartKeys = Object.keys(cart);

  if (cartKeys.length === 0) {
    emptyMsg.style.display = 'block';
    contentArea.style.display = 'none';
  } else {
    emptyMsg.style.display = 'none';
    contentArea.style.display = 'block';

    cartKeys.forEach(key => {
      const entry = cart[key];
      const item = entry.item;
      const qty = entry.quantity;
      
      const kiloPrice = parseFloat(item.price) || 0;
      const unitWeight = parseWeightFromPkg(item.pkg);
      // سعر القطعة = سعر الكيلو * وزن الوحدة
      const piecePrice = kiloPrice * unitWeight;
      const itemRowTotal = piecePrice * qty;
      grandTotal += itemRowTotal;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.name}</strong><br><small style="color:var(--gold);">${item.pkg || ''} | ${item.unit || ''}</small></td>
        <td>${kiloPrice.toFixed(2)} ج.م</td>
        <td>${qty}</td>
        <td style="text-align: left; font-weight: bold; color: var(--gold);">${itemRowTotal.toFixed(2)} ج.م</td>
      `;
      tbody.appendChild(tr);
    });

    grandTotalEl.textContent = `${grandTotal.toFixed(2)} ج.م`;
  }
  modal.classList.add('show');
}

function closeCartModal(e) {
  if (!e || e.target === document.getElementById('cartModal')) {
    document.getElementById('cartModal').classList.remove('show');
  }
}

function toggleCustomPhoneInput() {
  const select = document.getElementById('whatsappTargetSelect');
  const customInput = document.getElementById('customWhatsappInput');
  if (select.value === 'custom') {
    customInput.style.display = 'block';
  } else {
    customInput.style.display = 'none';
  }
}

// ── Export order data to Sheets and Redirect to WhatsApp ──
function submitOrderViaAppsScript() {
  const cartKeys = Object.keys(cart);
  if (cartKeys.length === 0) {
    showToast('السلة فارغة لا يوجد أصناف للارسال!');
    return;
  }

  // 1. تحديد رقم الواتساب الهدف المختار من العميل
  const select = document.getElementById('whatsappTargetSelect');
  let targetPhone = select.value;
  if (targetPhone === 'custom') {
    let customVal = document.getElementById('customWhatsappInput').value.trim();
    if (!customVal) {
      alert('الرجاء كتابة رقم الواتساب المطلوب إرسال الفاتورة إليه.');
      return;
    }
    // معالجة الرقم وإضافة رمز الدولة الافتراضي لجمهورية مصر العربية إذا لم يكن موجوداً
    if (customVal.startsWith('01')) customVal = '+20' + customVal.substring(1);
    targetPhone = customVal;
  }

  const submitBtn = document.getElementById('submitOrderBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل وتصدير الطلب...';

  // 2. تجهيز البيانات المنظّمة للإرسال إلى جوجل شيت
  let orderRows = [];
  let grandTotal = 0;
  let whatsappText = `*🧾 فاتورة شراء جديدة — Jana Gold*\n`;
  whatsappText += `--------------------------------------\n`;

  cartKeys.forEach(key => {
    const entry = cart[key];
    const item = entry.item;
    const qty = entry.quantity;

    const kiloPrice = parseFloat(item.price) || 0;
    const unitWeight = parseWeightFromPkg(item.pkg);
    const piecePrice = kiloPrice * unitWeight;
    const itemRowTotal = piecePrice * qty;
    grandTotal += itemRowTotal;

    // تجهيز كائن البيانات الموجه لملف جوجل شيت
    orderRows.push({
      "كود الصنف": item.code || '—',
      "الصنف": item.name,
      "التصنيف": item.categoryName,
      "الوحدة": item.unit || '—',
      "العبوة": item.pkg || '—',
      "سعر الكيلو": kiloPrice,
      "وزن الوحدة": unitWeight,
      "سعر القطعة": piecePrice,
      "الكمية المطلوبة": qty,
      "إجمالي القيمة": itemRowTotal
    });

    // بناء سطر النص المنسق لتطبيق الواتساب
    whatsappText += `▫️ *${item.name}*\n`;
    whatsappText += `  الكمية: ${qty} ${item.unit} | العبوة: ${item.pkg}\n`;
    whatsappText += `  سعر القطعة: ${piecePrice.toFixed(2)} ج.م\n`;
    whatsappText += `  الإجمالي: *${itemRowTotal.toFixed(2)} ج.م*\n`;
    whatsappText += `--------------------------------------\n`;
  });

  whatsappText += `\n💰 *الإجمالي النهائي للفاتورة: ${grandTotal.toFixed(2)} ج.م*`;

  // 3. إرسال البيانات فوراً لـ Apps Script ليقوم بإدراجها في الشيت
  if (APPS_SCRIPT_WEBAPP_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL') {
    // في حال عدم توفير الماكرو بعد، نقوم بالتحويل للواتساب مباشرة كدعم إضافي
    console.warn("Apps Script URL is not set. Skipping sheet export.");
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fab fa-whatsapp"></i> تأكيد وإرسال الطلب';
    window.open(`https://wa.me/${targetPhone.replace(/[+ ]/g, '')}?text=${encodeURIComponent(whatsappText)}`, '_blank');
    return;
  }

  fetch(APPS_SCRIPT_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors', // لتفادي مشاكل الـ CORS العشوائية في المتصفحات
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
      orderDate: new Date().toLocaleString('ar-EG'),
      items: orderRows,
      totalInvoice: grandTotal,
      customerTargetPhone: targetPhone
    })
  })
  .then(() => {
    // تم الإرسال بنجاح (أو تم التخطي بأمان بسبب نو-كورس)
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fab fa-whatsapp"></i> تأكيد وإرسال الطلب';
    showToast('تم حفظ طلبك في جوجل شيت وتوجيهك لواتساب! ✓');
    
    // فتح رابط الواتساب والتوجه للرقم المطلوب فوراً
    const cleanPhone = targetPhone.replace(/[+ ]/g, '');
    window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(whatsappText)}`, '_blank');
    
    // تفريغ السلة بعد نجاح العملية
    cart = {};
    updateFloatingCartBadge();
    closeCartModal(null);
    displayPage(currentIdx); // إعادة تحديث الواجهة لتصفير المدخلات
  })
  .catch(err => {
    console.error(err);
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fab fa-whatsapp"></i> تأكيد وإرسال الطلب';
    // في حال حدوث خطأ فادح بالاتصال، نفتح واتساب للعميل لحفظ حقه بالطلب
    window.open(`https://wa.me/${targetPhone.replace(/[+ ]/g, '')}?text=${encodeURIComponent(whatsappText)}`, '_blank');
  });
}

// ── display page ──
function displayPage(idx) {
  if (idx < 0 || idx >= allCats.length) return;
  currentIdx = idx;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (allCats[idx].isIndex) renderIndex();
  else renderCategory(allCats[idx]);

  updateNav();
  updateTabs();
}

function updateNav() {
  const total = allCats.length;
  prevBtn.disabled = currentIdx === 0;
  nextBtn.disabled = currentIdx === total - 1;
  progressFill.style.width = total <= 1 ? '0%' : (currentIdx / (total - 1)) * 100 + '%';

  if (currentIdx === 0) {
    pageInfoEl.textContent = 'الرئيسية';
    indexBtn.style.display = 'none';
  } else {
    pageInfoEl.textContent = `${currentIdx} / ${total - 1}`;
    indexBtn.style.display = 'inline-block';
  }
}

function updateTabs() {
  navStrip.querySelectorAll('.nav-tab').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.idx) === currentIdx);
  });
}

// ── nav buttons ──
prevBtn.onclick  = () => displayPage(currentIdx - 1);
nextBtn.onclick  = () => displayPage(currentIdx + 1);
indexBtn.onclick = () => displayPage(0);

function mkEyebrow(label) {
  const d = document.createElement('div');
  d.className = 'section-eyebrow';
  d.innerHTML = `<div class="eyebrow-line"></div><div class="eyebrow-text">${label}</div><div class="eyebrow-line"></div>`;
  return d;
}

// ── search ──
searchInput.addEventListener('input', () => {
  const term = searchInput.value.trim();
  clearSearch.style.display = term ? 'block' : 'none';
  if (!term) { autoBox.style.display = 'none'; displayPage(currentIdx); return; }

  const clean = cleanText(term);
  const results = [];

  allData.forEach(row => {
    const nameK = fk(row,'الصنف');
    const catK  = fk(row,'التصنيف');
    const nameT = nameK ? row[nameK] : '';
    const catT  = catK  ? row[catK]  : '';
    if (cleanText(nameT).includes(clean) || cleanText(catT).includes(clean)) {
      results.push({
        name: (nameT||'').trim(),
        price: (row[fk(row,'السعر')]||'').trim(),
        unit:  (row[fk(row,'الوحدة')]||'').trim(),
        pkg:   (row[fk(row,'العبوة')]||'').trim(),
        code:  (row[fk(row,'كود الصنف')]||'').trim(),
        categoryName: (catT||'').trim()
      });
    }
  });

  showAutoComplete(results.slice(0,5));
  showSearchResults(results, term);
});

function showAutoComplete(items) {
  if (!items.length) { autoBox.style.display = 'none'; return; }
  autoBox.innerHTML = '';
  items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'auto-item';
    d.innerHTML = `<span>${it.name}</span><span class="auto-cat">${it.categoryName}</span>`;
    d.onclick = () => {
      searchInput.value = it.name;
      autoBox.style.display = 'none';
      showSearchResults([it], it.name);
    };
    autoBox.appendChild(d);
  });
  autoBox.style.display = 'block';
}

function showSearchResults(results, term) {
  pageContent.innerHTML = '';
  if (!results.length) {
    pageContent.innerHTML = `<div class="no-results"><i class="fas fa-search-minus"></i><p>لا نتائج لـ "<strong>${term}</strong>"</p></div>`;
    return;
  }

  const bar = document.createElement('div');
  bar.className = 'cat-header-bar';
  bar.innerHTML = `<div class="ch-title">نتائج البحث</div><div class="ch-count">${results.length} نتيجة</div>`;
  pageContent.appendChild(bar);

  const table = document.createElement('table');
  table.className = 'items-table';
  table.innerHTML = `<thead><tr><th>الصنف</th><th>الوحدة</th><th>السعر</th><th style="text-align: left; padding-left: 20px;">الكمية</th></tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  results.forEach(it => tbody.appendChild(buildRow(it, true)));
  pageContent.appendChild(table);
}

clearSearch.onclick = () => {
  searchInput.value = '';
  clearSearch.style.display = 'none';
  autoBox.style.display = 'none';
  displayPage(currentIdx);
};

document.addEventListener('click', e => {
  if (!e.target.closest('.search-inner')) autoBox.style.display = 'none';
});

// ── load CSV ──
Papa.parse(SHEET_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete(res) {
    allData = res.data;
    processData(allData);
  },
  error() {
    pageContent.innerHTML = '<div style="padding:60px;text-align:center;color:#c0392b"><i class="fas fa-exclamation-triangle"></i><p style="margin-top:10px">خطأ في الاتصال بقاعدة البيانات</p></div>';
  }
});
</script>
</body>
</html>
