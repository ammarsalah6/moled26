<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة أسعار حلاوتنا 1447 هـ / 2026 م</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-dark: #7B5B00;
            --gold-mid: #C49A00;
            --gold-light: #F0D98A;
            --gold-accent: #A07800;
            --cream: #FDF8EC;
            --cream-dark: #F5EDD0;
            --text-dark: #2C1F00;
            --text-mid: #6B4E00;
            --border: #E8D48A;
            --white: #ffffff;
            --shadow: rgba(123,91,0,0.15);
            --page-pad: 28px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #F5EDD0;
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ===== BOOK WRAPPER ===== */
        .menu-book {
            max-width: 900px;
            margin: 30px auto;
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px var(--shadow), 6px 0 0 0 var(--gold-dark) inset;
            position: relative;
        }

        /* ===== PROGRESS BAR ===== */
        #progress-bar {
            height: 4px;
            background: var(--cream-dark);
            position: relative;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(to left, var(--gold-mid), var(--gold-light));
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ===== HEADER ===== */
        header {
            text-align: center;
            padding: 28px 20px 20px;
            background: linear-gradient(to bottom, #fff 0%, var(--cream) 100%);
            border-bottom: 2px dashed var(--border);
            position: relative;
        }

        header .logo-wrap img {
            max-width: 120px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
            filter: drop-shadow(0 4px 8px var(--shadow));
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: var(--gold-dark);
            font-weight: 700;
            letter-spacing: 1px;
        }

        header .tagline {
            color: var(--gold-accent);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        header .year-badge {
            display: inline-block;
            background: var(--cream-dark);
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.8rem;
            padding: 3px 12px;
            border-radius: 20px;
            margin-top: 8px;
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--cream);
            padding: 10px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .search-inner {
            position: relative;
            width: 100%;
            max-width: 560px;
        }

        .search-inner input {
            width: 100%;
            padding: 10px 46px 10px 44px;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            outline: none;
            background: #fff;
            color: var(--text-dark);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-inner input:focus {
            border-color: var(--gold-dark);
            box-shadow: 0 0 0 3px rgba(123,91,0,0.12);
        }

        .search-inner .si-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-mid);
            pointer-events: none;
        }

        #clearSearch {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-mid);
            cursor: pointer;
            display: none;
            background: none;
            border: none;
            font-size: 1rem;
            padding: 0;
        }

        /* ===== PAGE CONTENT ===== */
        #page-content {
            padding: var(--page-pad);
            min-height: 420px;
            max-height: 560px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: opacity 0.25s ease;
        }

        #page-content.fading { opacity: 0; }

        /* scrollbar */
        #page-content::-webkit-scrollbar { width: 6px; }
        #page-content::-webkit-scrollbar-track { background: var(--cream); }
        #page-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ===== CATEGORY TITLE ===== */
        .cat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .cat-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--cream-dark);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--gold-dark);
            flex-shrink: 0;
        }

        .cat-title-text {
            font-family: 'Amiri', serif;
            font-size: 1.7rem;
            color: var(--gold-dark);
            font-weight: 700;
        }

        .cat-count {
            margin-right: auto;
            background: var(--cream-dark);
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* ===== INDEX GRID ===== */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }

        .index-btn {
            background: #fff;
            border: 1.5px solid var(--border);
            color: var(--gold-dark);
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: right;
        }

        .index-btn:hover {
            background: var(--gold-dark);
            color: #fff;
            border-color: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px var(--shadow);
        }

        .index-btn .idx-count {
            font-size: 0.78rem;
            opacity: 0.7;
            font-weight: 500;
            margin-right: 6px;
        }

        .index-btn:hover .idx-count { opacity: 0.85; }

        /* ===== ITEMS GRID ===== */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .menu-item {
            background: #fff;
            border: 1.5px solid var(--border);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            cursor: pointer;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            border-color: var(--gold-mid);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .item-name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.97rem;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .item-unit {
            font-size: 0.8rem;
            color: var(--text-mid);
            background: var(--cream);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid var(--border);
        }

        .item-package {
            font-size: 0.78rem;
            color: #5a3e00;
            background: #fff3cc;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid #e8c84a;
            margin-right: 4px;
        }

        .item-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
            margin-right: 10px;
        }

        .item-price {
            font-weight: 800;
            color: var(--gold-accent);
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .item-price .currency {
            font-size: 0.75rem;
            color: var(--gold-mid);
            font-weight: 500;
        }

        /* copy + share buttons */
        .item-actions {
            display: flex;
            gap: 5px;
        }

        .act-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--cream);
            color: var(--text-mid);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .act-btn:hover { background: var(--gold-dark); color: #fff; border-color: var(--gold-dark); }
        .act-btn.wa:hover { background: #25D366; border-color: #25D366; color: #fff; }
        .act-btn.copied { background: #25D366; border-color: #25D366; color: #fff; }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--gold-dark);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-family: 'Tajawal', sans-serif;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== SHOW MORE BTN ===== */
        .toggle-btn {
            width: 100%;
            margin-top: 14px;
            padding: 11px;
            border: 1.5px dashed var(--border);
            background: var(--cream);
            color: var(--gold-dark);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .toggle-btn:hover {
            background: var(--gold-dark);
            color: #fff;
            border-style: solid;
            border-color: var(--gold-dark);
        }

        /* ===== NAV ===== */
        .pagination-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: var(--gold-mid);
            position: relative;
        }

        .nav-btn {
            background: var(--gold-dark);
            color: #fff;
            padding: 9px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .nav-btn:hover:not(:disabled) {
            background: #4A3600;
            transform: scale(1.03);
        }

        .nav-btn:disabled {
            background: rgba(123,91,0,0.3);
            cursor: not-allowed;
            color: rgba(255,255,255,0.5);
        }

        .nav-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #pageInfo {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }

        .index-nav-btn {
            background: #fff;
            color: var(--gold-dark);
            padding: 6px 14px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            display: none;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .index-nav-btn:hover { background: var(--cream-dark); }

        /* ===== SOCIAL BAR ===== */
        .social-bar {
            max-width: 900px;
            margin: 16px auto 30px;
            background: var(--gold-dark);
            padding: 12px 0;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 14px var(--shadow);
        }

        .social-bar a {
            color: var(--gold-light);
            font-size: 1.25rem;
            margin: 0 14px;
            transition: all 0.25s;
            display: inline-block;
        }

        .social-bar a:hover { color: #fff; transform: scale(1.15) translateY(-2px); }

        /* ===== SEARCH RESULTS EMPTY ===== */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-mid);
        }

        .no-results i { font-size: 2.5rem; color: var(--border); margin-bottom: 12px; display: block; }
        .no-results p { font-size: 1.05rem; }

        /* ===== SCROLL TO TOP ===== */
        #scrollTopBtn {
            position: absolute;
            bottom: 70px;
            left: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gold-dark);
            color: #fff;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px var(--shadow);
            transition: opacity 0.3s;
            z-index: 5;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 600px) {
            .menu-book { margin: 0; border-radius: 0; box-shadow: none; }
            #page-content { padding: 16px; max-height: 52vh; }
            .items-grid, .index-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 1.7rem; }
            .cat-title-text { font-size: 1.4rem; }
            .pagination-nav { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
            .nav-btn { font-size: 0.82rem; padding: 8px 14px; }
            .nav-center { order: -1; width: 100%; }
            .social-bar { margin: 12px 0 20px; border-radius: 0; }
        }
    </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script>
const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRGoyAsNR0JPLb2TQNSDI55YiWFCV0b5bRAmUTsWJxLvjCL_wA-NuoK2_OCCPggtjQ7eI_1JsXxvxlX/pub?output=csv';

const pageContent = document.getElementById('page-content');
const searchInput  = document.getElementById('searchInput');
const clearSearch  = document.getElementById('clearSearch');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const indexBtn     = document.getElementById('indexBtn');
const pageInfoEl   = document.getElementById('pageInfo');
const progressFill = document.getElementById('progress-fill');
const scrollTopBtn = document.getElementById('scrollTopBtn');
const toastEl      = document.getElementById('toast');

let allData = [];
let allCategories = [];
let currentPageIndex = 0;
const PREVIEW_COUNT = 6;

/* ---- Category icons map ---- */
const catIcons = {
    default: 'fa-box-open',
    'عسل':   'fa-jar',
    'زيوت':  'fa-flask',
    'أعشاب': 'fa-leaf',
    'بهارات':'fa-pepper-hot',
    'مكسرات':'fa-seedling',
    'حلاوة': 'fa-star',
    'تمر':   'fa-drumstick-bite',
};

function getCatIcon(name) {
    for (const [k, v] of Object.entries(catIcons)) {
        if (name.includes(k)) return v;
    }
    return catIcons.default;
}

/* ---- Utils ---- */
function findKey(item, target) {
    for (const key in item) {
        if (key && key.trim() === target) return key;
    }
    return null;
}

function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function animatePage(cb) {
    pageContent.classList.add('fading');
    setTimeout(() => {
        cb();
        pageContent.classList.remove('fading');
        pageContent.scrollTop = 0;
    }, 200);
}

/* ---- Process CSV ---- */
function processData(data) {
    const map = {};
    data.forEach(item => {
        const catKey  = findKey(item, 'التصنيف');
        const nameKey = findKey(item, 'الصنف');
        const priceKey= findKey(item, 'السعر');
        const unitKey = findKey(item, 'الوحدة');
        const pkgKey  = findKey(item, 'العبوة');

        const cat   = catKey   ? item[catKey].trim()   : null;
        const name  = nameKey  ? item[nameKey].trim()  : null;
        const price = priceKey ? item[priceKey].trim() : null;
        const unit  = unitKey  ? item[unitKey].trim()  : null;
        const pkg   = pkgKey   ? item[pkgKey].trim()   : null;

        if (cat && name) {
            if (!map[cat]) map[cat] = [];
            map[cat].push({ name, price, unit, pkg });
        }
    });

    const cats = Object.keys(map)
        .filter(k => map[k].length > 0)
        .map(k => ({ categoryName: k, items: map[k], isIndex: false }));

    allCategories = [{ categoryName: 'فهرس المنتجات', isIndex: true, items: [] }, ...cats];
}

/* ---- Render Index ---- */
function renderIndex() {
    const grid = document.createElement('div');
    grid.className = 'index-grid';

    allCategories.forEach((cat, idx) => {
        if (idx === 0) return;
        const btn = document.createElement('button');
        btn.className = 'index-btn';
        btn.innerHTML = `
            <span>${cat.categoryName}</span>
            <span class="idx-count">${cat.items.length} صنف <i class="fas fa-arrow-left" style="font-size:0.75rem;margin-right:4px"></i></span>
        `;
        btn.onclick = () => displayPage(idx);
        grid.appendChild(btn);
    });

    pageContent.innerHTML = '';
    const hdr = buildCatHeader('فهرس المنتجات', allCategories.length - 1 + ' تصنيف', 'fa-th-large');
    pageContent.appendChild(hdr);
    pageContent.appendChild(grid);
}

/* ---- Build category header ---- */
function buildCatHeader(title, countText, iconClass) {
    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.innerHTML = `
        <div class="cat-icon"><i class="fas ${iconClass}"></i></div>
        <div class="cat-title-text">${title}</div>
        <div class="cat-count">${countText}</div>
    `;
    return hdr;
}

/* ---- Build item card ---- */
function buildItemCard(item) {
    const el = document.createElement('div');
    el.className = 'menu-item';

    const priceDisplay = item.price || '--';
    const badges = [];
    if (item.pkg)  badges.push(`<span class="item-package"><i class="fas fa-box" style="font-size:0.7rem;margin-left:3px"></i>${item.pkg}</span>`);
    if (item.unit) badges.push(`<span class="item-unit">${item.unit}</span>`);
    const badgesHTML = badges.length ? `<div class="item-badges">${badges.join('')}</div>` : '';
    const shareText = `*${item.name}*\nالسعر: ${priceDisplay} ج.م${item.pkg ? '\nالعبوة: ' + item.pkg : ''}${item.unit ? '\nالوحدة: ' + item.unit : ''}\n\n📍 Jana Gold`;

    el.innerHTML = `
        <div class="item-details">
            <div class="item-name">${item.name}</div>
            ${badgesHTML}
        </div>
        <div class="item-right">
            <div class="item-price">${priceDisplay} <span class="currency">ج.م</span></div>
            <div class="item-actions">
                <button class="act-btn copy-btn" title="نسخ السعر"><i class="fas fa-copy"></i></button>
                <a class="act-btn wa" href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank" title="مشاركة واتساب"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    `;

    el.querySelector('.copy-btn').onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(`${item.name}: ${priceDisplay} ج.م`).catch(() => {});
        const btn = e.currentTarget;
        btn.classList.add('copied');
        btn.innerHTML = '<i class="fas fa-check"></i>';
        showToast('تم نسخ السعر ✓');
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fas fa-copy"></i>';
        }, 1800);
    };

    return el;
}

/* ---- Render Category ---- */
function renderCategory(catData, fullView = false) {
    pageContent.innerHTML = '';

    if (catData.isIndex) { renderIndex(); return; }

    const icon = getCatIcon(catData.categoryName);
    const hdr  = buildCatHeader(catData.categoryName, catData.items.length + ' صنف', icon);
    pageContent.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'items-grid';

    const shown = (fullView || catData.items.length <= PREVIEW_COUNT)
        ? catData.items
        : catData.items.slice(0, PREVIEW_COUNT);

    shown.forEach(item => grid.appendChild(buildItemCard(item)));
    pageContent.appendChild(grid);

    if (catData.items.length > PREVIEW_COUNT) {
        const btn = document.createElement('button');
        btn.className = 'toggle-btn';
        btn.setAttribute('data-full', fullView ? '1' : '0');

        if (fullView) {
            btn.innerHTML = '<i class="fas fa-chevron-up"></i> عرض أقل';
        } else {
            btn.innerHTML = `<i class="fas fa-chevron-down"></i> عرض المزيد (${catData.items.length - PREVIEW_COUNT} صنف إضافي)`;
        }

        btn.onclick = () => {
            const isNowFull = btn.getAttribute('data-full') !== '1';
            renderCategory(catData, isNowFull);
            if (!isNowFull) pageContent.scrollTop = 0;
        };

        pageContent.appendChild(btn);
    }
}

/* ---- Display page ---- */
function displayPage(idx) {
    if (idx < 0 || idx >= allCategories.length) return;
    animatePage(() => {
        currentPageIndex = idx;
        renderCategory(allCategories[idx]);
        updateNav();
    });
}

/* ---- Navigation UI ---- */
function updateNav() {
    const total = allCategories.length;
    const isFirst = currentPageIndex === 0;
    const isLast  = currentPageIndex === total - 1;

    prevBtn.disabled = isFirst;
    nextBtn.disabled = isLast;

    // progress
    const pct = total <= 1 ? 0 : (currentPageIndex / (total - 1)) * 100;
    progressFill.style.width = pct + '%';

    if (isFirst) {
        pageInfoEl.innerHTML = 'القائمة الرئيسية';
        prevBtn.innerHTML = '<i class="fas fa-chevron-right"></i> السابق';
        indexBtn.style.display = 'none';
    } else {
        pageInfoEl.innerHTML = `${currentPageIndex} / ${total - 1}`;
        indexBtn.style.display = 'inline-flex';
        const prevName = currentPageIndex === 1 ? 'الفهرس' : allCategories[currentPageIndex - 1].categoryName;
        prevBtn.innerHTML = `<i class="fas fa-chevron-right"></i> ${prevName.length > 8 ? 'السابق' : prevName}`;
    }

    if (!isLast) {
        const nextName = allCategories[currentPageIndex + 1].categoryName;
        nextBtn.innerHTML = `${nextName.length > 8 ? 'التالي' : nextName} <i class="fas fa-chevron-left"></i>`;
    } else {
        nextBtn.innerHTML = 'النهاية <i class="fas fa-check"></i>';
    }
}

/* ---- Events ---- */
prevBtn.onclick  = () => displayPage(currentPageIndex - 1);
nextBtn.onclick  = () => displayPage(currentPageIndex + 1);
indexBtn.onclick = () => displayPage(0);

pageContent.addEventListener('scroll', () => {
    scrollTopBtn.style.display = pageContent.scrollTop > 120 ? 'flex' : 'none';
});

scrollTopBtn.onclick = () => pageContent.scrollTop = 0;

/* ---- Search ---- */
let searchTimeout;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const term = e.target.value.trim();
    clearSearch.style.display = term ? 'block' : 'none';
    searchTimeout = setTimeout(() => handleSearch(term.toLowerCase()), 280);
});

clearSearch.onclick = () => {
    searchInput.value = '';
    clearSearch.style.display = 'none';
    displayPage(currentPageIndex);
    document.querySelector('.pagination-nav').style.display = 'flex';
    document.querySelector('.social-bar').style.display = 'block';
};

function handleSearch(term) {
    if (!term) {
        displayPage(currentPageIndex);
        document.querySelector('.pagination-nav').style.display = 'flex';
        document.querySelector('.social-bar').style.display = 'block';
        return;
    }

    document.querySelector('.pagination-nav').style.display = 'none';
    document.querySelector('.social-bar').style.display = 'none';

    const filtered = allData.filter(item => {
        const nk = findKey(item, 'الصنف');
        const ck = findKey(item, 'التصنيف');
        return (nk && item[nk] && item[nk].toLowerCase().includes(term))
            || (ck && item[ck] && item[ck].toLowerCase().includes(term));
    });

    pageContent.innerHTML = '';

    if (!filtered.length) {
        pageContent.innerHTML = `
            <div class="no-results">
                <i class="fas fa-search-minus"></i>
                <p>لا توجد نتائج لـ "<strong>${term}</strong>"</p>
            </div>`;
        return;
    }

    const hdr = buildCatHeader(`نتائج البحث: "${term}"`, filtered.length + ' نتيجة', 'fa-search');
    pageContent.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'items-grid';

    filtered.forEach(item => {
        const nk = findKey(item, 'الصنف');
        const pk = findKey(item, 'السعر');
        const uk = findKey(item, 'الوحدة');
        const pgk= findKey(item, 'العبوة');
        grid.appendChild(buildItemCard({
            name:  item[nk] ? item[nk].trim() : '',
            price: pk  && item[pk]  ? item[pk].trim()  : null,
            unit:  uk  && item[uk]  ? item[uk].trim()  : null,
            pkg:   pgk && item[pgk] ? item[pgk].trim() : null,
        }));
    });

    pageContent.appendChild(grid);
}

/* ---- Fetch ---- */
Papa.parse(sheetURL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete(results) {
        allData = results.data;
        processData(allData);
        if (allCategories.length > 1) {
            displayPage(0);
        } else {
            pageContent.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-mid)">لا توجد بيانات للعرض.</div>';
        }
    },
    error() {
        pageContent.innerHTML = '<div style="padding:40px;text-align:center;color:#c0392b"><i class="fas fa-exclamation-triangle"></i> خطأ في تحميل البيانات</div>';
    }
});
</script>
</body>
</html>
